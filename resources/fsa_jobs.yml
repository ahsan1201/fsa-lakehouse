resources:
  jobs:
    fsa_daily_load:
      name: fsa_daily_load
      description: Nightly FSA payments load. Generate (simulated source) → bronze → silver → gold.
      parameters:
        - name: batch_day
          default: "1"
      max_concurrent_runs: 1          # two loads at once would race on the same checkpoints
      email_notifications:
        on_failure: []                # add your email to get alerts
      # schedule:                     # uncomment to run nightly at 2:15 AM Eastern
      #   quartz_cron_expression: "0 15 2 * * ?"
      #   timezone_id: America/New_York
      tasks:
        - task_key: simulate_source_drop
          notebook_task:
            notebook_path: ../notebooks/01_generate_batch.py
        - task_key: bronze
          depends_on: [{ task_key: simulate_source_drop }]
          max_retries: 1              # absorbs the one-time schema-evolution restart
          notebook_task:
            notebook_path: ../notebooks/02_bronze_autoloader.py
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          max_retries: 1
          notebook_task:
            notebook_path: ../notebooks/03_silver.py
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../notebooks/04_gold.py
      # No cluster defined anywhere: tasks run on serverless jobs compute.

  pipelines:
    fsa_declarative:
      name: fsa_declarative
      catalog: ${var.catalog}
      schema: sdp
      serverless: true
      development: true
      configuration:
        landing_root: /Volumes/${var.catalog}/landing/raw
      libraries:
        - file:
            path: ../pipelines/fsa_declarative_pipeline.py
